<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbbc04">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Rhyme Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Roboto,'Helvetica Neue',Arial,sans-serif;color:#202124;background:#fff}
button,input,textarea{font:inherit;color:inherit}
header{padding:16px 16px 4px;position:sticky;top:0;background:#fff;z-index:2}
.search{display:flex;align-items:center;gap:8px;height:52px;padding:0 16px;border-radius:26px;background:#f1f3f4;box-shadow:0 1px 3px rgba(60,64,67,.25)}
.search input{flex:1;border:0;background:transparent;outline:0;font-size:16px;min-width:0}
.chips{display:flex;gap:8px;padding:10px 0 8px;overflow-x:auto}
.chip{flex:none;height:40px;padding:0 16px;border-radius:20px;border:1px solid #dadce0;background:#fff;font-size:14px}
.chip[aria-pressed=true]{background:#202124;color:#fff;border-color:#202124}
.sum{margin:4px 16px 12px;padding:14px 16px;border-radius:12px;border:1px solid #dadce0;display:flex;justify-content:space-between}
.sum small{display:block;font-size:12px;color:#5f6368}.sum b{font-size:28px;font-weight:500}
.grid{columns:2;column-gap:10px;padding:0 16px 110px}
.card{break-inside:avoid;margin-bottom:10px;padding:14px;border-radius:10px;position:relative}
.meta{font-size:12px;color:#5f6368}.card h3{margin:4px 0 8px;font-size:16px;font-weight:500;word-break:break-word}
.f{font-size:14px;line-height:1.5;margin:0 0 8px}.f small{display:block;font-size:11px;color:#3c4043}
mark{background:rgba(255,255,255,.75);border-radius:4px;padding:0 3px;font-weight:600;color:inherit}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.row button{min-height:44px;min-width:44px;border:0;background:transparent;font-size:13px;color:#3c4043}
.tags{font-size:12px;color:#3c4043}
.fab{position:fixed;right:16px;bottom:24px;height:56px;padding:0 22px 0 16px;border:0;border-radius:16px;background:#fbbc04;font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:0 3px 8px rgba(60,64,67,.35)}
.empty{padding:32px 24px;color:#5f6368;line-height:1.6;text-align:center}
dialog{width:min(92vw,420px);border:0;border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 12px;font-size:18px;font-weight:500}
.btn{min-height:48px;padding:0 20px;border-radius:24px;border:0;background:#fbbc04;font-weight:500;width:100%;margin-top:8px}
.btn.alt{background:#f1f3f4}
dialog input[type=text],textarea{width:100%;border:1px solid #dadce0;border-radius:10px;padding:12px;margin-top:8px;font-size:15px}
textarea{height:120px;resize:vertical}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#202124;color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;display:none;z-index:9}
:focus-visible{outline:2px solid #1a73e8;outline-offset:2px}
</style></head><body>
<header>
<label class="search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><input id="q" type="search" placeholder="Search conversations" aria-label="Search conversations"></label>
<div class="chips" id="chips"></div>
</header>
<div class="sum" id="sum"></div>
<main class="grid" id="grid"></main>
<button class="fab" id="add" aria-label="Import chat"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#202124" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Import chat</button>
<dialog id="dlg">
<h2>Import a conversation</h2>
<input type="file" id="file" accept=".txt,text/plain" hidden>
<button class="btn" id="pick">Choose WhatsApp .txt file</button>
<p class="meta" style="margin:14px 0 0">Or paste text from any app:</p>
<input type="text" id="nm" placeholder="Name this conversation" aria-label="Conversation name">
<textarea id="tx" placeholder="Paste messages here" aria-label="Pasted messages"></textarea>
<button class="btn alt" id="go">Analyze pasted text</button>
<button class="btn alt" id="x">Cancel</button>
</dialog>
<div id="toast" role="status"></div>
<script>
const KEY='rt_v1',$=s=>document.querySelector(s);
const TYPES={rhyme:'Rhyme',alliteration:'Alliteration',simile:'Simile',repeat:'Repetition'};
const COLORS=['#fff8b8','#e2f6d3','#d4e4ed','#fdcfe8','#f6e2dd','#efeff1'];
let data=load(),filter='all',term='';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('Storage is full. Delete a card.')}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STOP=new Set('a an the and or but of to in on at is it i you he she we they my your me his her our their this that for with as be are was were am so do not no by from up if its'.split(' '));
const WEAK=/^(ing|ed|er|es|ly|ion|ent|ant)$/;
const words=s=>s.toLowerCase().match(/[a-z']+/g)||[];
const RX=/^\[?(\d{1,4}[\/.\-]\d{1,2}[\/.\-]\d{1,4}),?\s+(\d{1,2}:\d{2}(?::\d{2})?\s?(?:[AaPp]\.?[Mm]\.?)?)\]?\s*(?:-\s*)?([^:]{1,60}?):\s(.*)$/;
function parse(text){const msgs=[];
text.replace(/[\u200e\u202f]/g,' ').split(/\r?\n/).forEach(l=>{const m=l.match(RX);
if(m)msgs.push({who:m[3].trim(),t:m[4]});
else if(msgs.length&&l.trim())msgs[msgs.length-1].t+='\n'+l;
else if(l.trim())msgs.push({who:'',t:l})});
return msgs.filter(m=>!/^<?(media omitted|image omitted)>?$/i.test(m.t.trim())&&!/deleted|end-to-end encrypted/i.test(m.t));}
function rkey(w){w=w.replace(/'/g,'');if(w.length<3)return null;let tail='';
if(/[^aeiouy]e$/.test(w)&&w.length>3){w=w.slice(0,-1);tail='e'}
const m=w.match(/[aeiouy]+[^aeiouy]*$/);return m?m[0]+tail:null}
function mk(t,marks){let i=-1;return t.split(/([A-Za-z']+)/).map(p=>/^[A-Za-z']+$/.test(p)?(++i,marks.has(i)?'<mark>'+esc(p)+'</mark>':esc(p)):esc(p)).join('')}
const clauses=t=>t.split(/[\n,;.!?\u2014]+|\s-\s/).map(s=>s.trim()).filter(s=>words(s).length>=2);
function analyze(msgs){const out=[],seen=new Set();let prev=null;
const add=(k,h)=>{if(!seen.has(h)){seen.add(h);out.push({k,h})}};
const lw=c=>{const w=words(c);return[w[w.length-1],w.length-1]};
const chk=(a,b)=>{const[x,i]=lw(a),[y,j]=lw(b);if(!x||!y||x===y||STOP.has(x)||STOP.has(y))return;
const kx=rkey(x);if(kx&&kx===rkey(y)&&!WEAK.test(kx))add('rhyme',mk(a,new Set([i]))+' / '+mk(b,new Set([j])))};
msgs.forEach(m=>{const cl=clauses(m.t);
for(let i=1;i<cl.length;i++)chk(cl[i-1],cl[i]);
if(prev&&prev.length&&cl.length)chk(prev[prev.length-1],cl[0]);
if(cl.length)prev=cl;
cl.forEach(c=>{const w=words(c),keep=[];w.forEach((x,i)=>{if(!STOP.has(x)&&x.length>1)keep.push([x,i])});
for(let s=0;s<keep.length;){let e=s+1;while(e<keep.length&&keep[e][0][0]===keep[s][0][0])e++;
if(e-s>=3)add('alliteration',mk(c,new Set(keep.slice(s,e).map(k=>k[1]))));s=e}
const r=c.match(/\b(\w{3,})(\s+\1\b)+/i);if(r)add('repeat',esc(c).replace(esc(r[0]),'<mark>'+esc(r[0])+'</mark>'))});
m.t.split('\n').forEach(l=>{const s=l.match(/\b(like\s+(a|an)\s+[a-z']+|as\s+[a-z']+\s+as\s+(a|an|the)\s+[a-z']+)/i);
if(s)add('simile',esc(l.trim()).replace(esc(s[0]),'<mark>'+esc(s[0])+'</mark>'))})});
return out.slice(0,80)}
function importText(text,name,src){const msgs=parse(text);
if(!msgs.length){toast('No messages found in that text.');return}
const f=analyze(msgs),c={};f.forEach(x=>c[x.k]=(c[x.k]||0)+1);
const item={id:Date.now(),name:name||'Untitled chat',src,date:new Date().toLocaleDateString(),n:msgs.length,c,f};
data=data.filter(d=>d.name!==item.name||d.src!==src);data.unshift(item);save();render();
toast(f.length?'Found '+f.length+' items in '+msgs.length+' messages.':'No rhymes or devices found.')}
const cleanName=n=>n.replace(/\.txt$/i,'').replace(/^WhatsApp Chat (with|-)\s*/i,'');
function render(){
$('#chips').innerHTML=[['all','All'],...Object.entries(TYPES)].map(([k,v])=>`<button class="chip" data-k="${k}" aria-pressed="${filter===k}">${v}</button>`).join('');
const tot={};data.forEach(d=>Object.entries(d.c).forEach(([k,v])=>tot[k]=(tot[k]||0)+v));
$('#sum').innerHTML=`<div><small>Rhymes</small><b>${tot.rhyme||0}</b></div><div><small>Other devices</small><b>${(tot.alliteration||0)+(tot.simile||0)+(tot.repeat||0)}</b></div><div><small>Chats</small><b>${data.length}</b></div>`;
const t=term.toLowerCase();
const cards=data.map((d,i)=>{let f=d.f.filter(x=>filter==='all'||x.k===filter);
if(t)f=f.filter(x=>d.name.toLowerCase().includes(t)||x.h.replace(/<[^>]+>/g,'').toLowerCase().includes(t));
if(!f.length&&!(t&&d.name.toLowerCase().includes(t)&&filter==='all'))return'';
const open=d.open,show=open?f:f.slice(0,3);
return`<article class="card" style="background:${COLORS[i%COLORS.length]}"><div class="meta">${esc(d.src)} · ${d.date}</div><h3>${esc(d.name)}</h3>
${show.map(x=>`<p class="f">${x.h}<small>${TYPES[x.k]}</small></p>`).join('')||'<p class="f">Nothing found in this chat.</p>'}
<div class="tags">${Object.entries(d.c).map(([k,v])=>TYPES[k]+' ×'+v).join(' · ')}</div>
<div class="row"><button data-more="${d.id}">${f.length>3?(open?'Show less':'Show all '+f.length):''}</button><button data-del="${d.id}" aria-label="Delete ${esc(d.name)}">Delete</button></div></article>`}).join('');
$('#grid').innerHTML=cards||`<div class="empty" style="column-span:all">${data.length?'No matches.':'Nothing here yet.<br>In WhatsApp, open a chat, tap Export chat, choose Without media, then share it to Rhyme Tracker. Or tap Import chat.'}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.k){filter=b.dataset.k;render()}
if(b.dataset.more){const d=data.find(x=>x.id==b.dataset.more);d.open=!d.open;render()}
if(b.dataset.del){data=data.filter(x=>x.id!=b.dataset.del);save();render()}});
$('#q').oninput=e=>{term=e.target.value;render()};
$('#add').onclick=()=>$('#dlg').showModal();$('#x').onclick=()=>$('#dlg').close();
$('#pick').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#dlg').close();
importText(await f.text(),cleanName(f.name),/whatsapp/i.test(f.name)?'WhatsApp':'Text file');e.target.value=''};
$('#go').onclick=()=>{const t=$('#tx').value;if(!t.trim()){toast('Paste some text first.');return}
$('#dlg').close();importText(t,$('#nm').value.trim(),'Pasted');$('#tx').value='';$('#nm').value=''};
async function checkShared(){if(!/shared=1/.test(location.search))return;
try{const c=await caches.open('rt-share'),k=new URL('shared-latest',location.origin+location.pathname).href,r=await c.match(k);
if(r){const name=decodeURIComponent(r.headers.get('X-Name')||'');importText(await r.text(),cleanName(name),/whatsapp/i.test(name)?'WhatsApp':'Shared');await c.delete(k)}}catch(e){}
history.replaceState(null,'',location.pathname)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();checkShared();
</script></body></html>
